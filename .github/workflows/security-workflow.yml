name: Security Workflow (Reusable)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: security-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  bandit-scan:
    name: Bandit (Backend)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install "bandit[sarif]==1.7.*"

      - name: Run Bandit
        run: |
          bandit -r backend \
            -f sarif -o bandit-results.sarif \
            -ll -ii \
            --exclude '**/tests/**,**/.venv/**,**/migrations/**' || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  eslint-security:
    name: ESLint Security (Frontend)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install SARIF formatter
        run: npm install --no-save @microsoft/eslint-formatter-sarif

      - name: Run ESLint security scan
        id: eslint-scan
        run: |
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif || true

          if [ -f "eslint-results.sarif" ]; then
            echo "sarif-created=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif-created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF result
        if: steps.eslint-scan.outputs.sarif-created == 'true'
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: frontend/eslint-results.sarif
          category: eslint-security

  semgrep-scan:
    name: Semgrep full-repo scan
    needs: [bandit-scan, eslint-security]
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --sarif --output semgrep.sarif \
            --error \
            --metrics=off || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql-scan:
    name: CodeQL Scan
    needs: semgrep-scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  security-containers:
    name: Container Security Scan
    needs: codeql-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Detect Dockerfiles
        id: detect-dockerfiles
        run: bash scripts/security/detect-dockerfiles.sh

      - name: Install Trivy CLI
        run: bash scripts/security/install-trivy.sh

      - name: Generate Trivy SARIF Report
        run: bash scripts/security/generate-trivy-sarif.sh

      - name: Upload Trivy SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-security-scan'

      - name: Enforce Trivy Security Gate
        run: bash scripts/security/enforce-trivy.sh
