name: Security Containers Workflow

on:
  # push:
  #   branches:
  #     - main
  #     - develop
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-containers:
    name: Container Security & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Environment Setup & Docker Info
        run: bash scripts/env-setup.sh

      - name: Step 1 - Detect Docker Compose files
        id: detect-compose
        run: bash scripts/detect-compose.sh

      - name: Step 2 - Validate Docker Compose Syntax
        if: ${{ steps.detect-compose.outputs.has_compose == 'true' }}
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/validate-compose.sh

      - name: Setup Python for Compose Lint
        if: ${{ steps.detect-compose.outputs.has_compose == 'true' }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Step 3 - Compose Lint (Security & Best Practices)
        if: ${{ steps.detect-compose.outputs.has_compose == 'true' }}
        env:
          COMPOSE_FILES: ${{ steps.detect-compose.outputs.compose_files }}
        run: bash scripts/compose-lint.sh

      - name: Step 5 - Detect Dockerfiles
        id: detect-dockerfiles
        run: bash scripts/detect-dockerfiles.sh

      - name: Install Trivy CLI
        run: bash scripts/install-trivy.sh

      - name: Generate Trivy SARIF Report
        run: bash scripts/generate-trivy-sarif.sh

      - name: Upload Trivy SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-security-scan'

      - name: Step 4 - Enforce Trivy Security Gate (Log Output & Fail Fast)
        run: bash scripts/enforce-trivy.sh
        