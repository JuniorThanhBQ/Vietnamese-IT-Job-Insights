  bandit-scan:
    name: Bandit (Backend)
    needs: secret-scan
    permissions:
      contents: read
      security-events: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install "bandit[sarif]==1.7.*"

      - name: Run Bandit
        run: |
          bandit -r backend \
            -f sarif -o bandit-results.sarif \
            -ll -ii \
            --exclude '**/tests/**,**/.venv/**,**/migrations/**'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Open security issue on failure
        if: failure()
        uses: ./.github/actions/report-security-issue
        with:
          check-name: 'Bandit (backend)'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scan:
    name: Semgrep full-repo scan
    needs: [eslint-scan, bandit-scan]
    permissions:
      contents: read
      security-events: write
      issues: write
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --sarif --output semgrep.sarif \
            --error \
            --metrics=off

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Open security issue on failure
        if: failure()
        uses: ./.github/actions/report-security-issue
        with:
          check-name: 'Semgrep scan'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  codeql-scan:
    name: CodeQL - ${{ matrix.language }}
    needs: semgrep-scan
    permissions:
      contents: read
      security-events: write
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./codeql_config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          category: '/language:${{ matrix.language }}'

      - name: Open security issue on failure
        if: failure()
        uses: ./.github/actions/report-security-issue
        with:
          check-name: 'CodeQL analysis (${{ matrix.language }})'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          