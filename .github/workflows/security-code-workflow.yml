name: Security Code Workflow

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: security-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0 

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Open security issue on failure
        if: failure()
        uses: ./.github/actions/report-security-issue
        with:
          check-name: 'Secret scanning (gitleaks)'
          details: >-
            A potential hard-coded secret was detected in the repository or its history.
            Do not paste the secret value here — rotate the credential immediately, then
            check the gitleaks report in this run's logs/artifacts for the file and line.
          github-token: ${{ secrets.GITHUB_TOKEN }}

