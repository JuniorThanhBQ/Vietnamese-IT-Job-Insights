name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Backend - Format / Lint / Test (skip if backend absent)
        run: |
          if [ -d backend ]; then
            cd backend || exit 1
            python -m pip install --upgrade pip
            if [ -f pyproject.toml ]; then
              python -m pip install -e .
            elif [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            fi
            black --check .
            pylint app
            if [ -d tests ]; then
              pytest -q tests
            else
              echo "No backend tests; skipping pytest"
            fi
          else
            echo "No backend directory; skipping backend checks"
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af4
        with:
          node-version: '18'

      - name: Frontend -Install / Lint / Test (skip if frontend absent)
        run: |
          if [ -d frontend ]; then
            cd frontend || exit 1
            if [ -f package.json ]; then
              npm ci --silent
              npm run lint --silent
              npm test --silent
            else
              echo "No package.json; skipping frontend npm tasks"
            fi
          else
            echo "No frontend directory; skipping frontend checks"
          fi
