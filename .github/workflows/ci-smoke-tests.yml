name: CI Smoke Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Backend Dependencies
        run: |
          if [ -d backend ]; then
            cd backend
            python -m pip install --upgrade pip
            if [ -f pyproject.toml ]; then
              python -m pip install -e .
            elif [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            fi
          fi
      - name: Run Backend Smoke Test
        run: |
          if [ -d backend/tests ]; then
            cd backend && pytest -q tests
          else
            echo "No backend tests found; skipping backend smoke test"
          fi

  frontend-smoke:
    name: Frontend Smoke Tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Frontend Dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci || true
          fi
      - name: Run Frontend Lint
        run: |
          if [ -d frontend ]; then
            cd frontend && npm run lint --silent
          else
            echo "No frontend directory found; skipping frontend lint"
          fi
