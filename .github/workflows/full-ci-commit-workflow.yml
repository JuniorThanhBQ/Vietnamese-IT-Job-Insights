name: Full CI Commit Workflow

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:

concurrency:
  group: full-ci-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  issues: write

jobs:
  build:
    name: Build Stage Workflow
    uses: ./.github/workflows/build-workflow.yml

  lint:
    name: Lint Stage Workflow
    needs: build
    uses: ./.github/workflows/lint-workflow.yml

  security:
    name: Security Stage Workflow
    needs: lint
    uses: ./.github/workflows/security-workflow.yml

  testing:
    name: Testing Stage Workflow
    needs: security
    uses: ./.github/workflows/testing-workflow.yml
