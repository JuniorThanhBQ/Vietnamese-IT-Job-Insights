[project]
name = "vietnamese-it-job-insights-api"
version = "0.1.0"
description = "Scaffolded FastAPI backend with feature-based architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.10.0",
    "python-jose[cryptography]>=3.6.0",
    "passlib[bcrypt]>=1.8.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
